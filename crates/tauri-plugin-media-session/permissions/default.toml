# Conjunto padrão do plugin: sem isto a capability teria de listar os sete
# comandos um a um, e qualquer comando novo viraria uma invocação bloqueada em
# runtime — silenciosa até alguém tocar o botão de play na head unit.
"$schema" = "schemas/schema.json"

[default]
description = """
Permite ler a sessão de mídia ativa e comandá-la (play/pause/faixa), mais a
checagem e o pedido de acesso às notificações — que é como o Android entrega
`MediaSessionManager.getActiveSessions()`.
"""
permissions = [
  "allow-now-playing",
  "allow-play",
  "allow-pause",
  "allow-next",
  "allow-previous",
  "allow-has-notification-access",
  "allow-request-notification-access",
]
