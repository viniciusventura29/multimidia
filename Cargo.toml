[workspace]
members = ["src-tauri", "crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

# Um target/ de 1,8 GB para um app deste tamanho é quase todo símbolo de debug,
# e quase todo ele vem das dependências (tauri, wry, objc2...) — que ninguém vai
# depurar linha a linha. Cortar os símbolos delas devolve mais de 1 GB e mantém
# o nosso código com backtrace com número de linha.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Release para a head unit: LTO fino e uma unidade de codegen compilam mais
# devagar, mas o binário fica menor e mais rápido — e o strip é o maior corte
# isolado de tamanho do .so no APK. `opt-level = 3` de propósito: telemetria em
# tempo real (parser ELM327, guiagem, serde na cadência do OBD) vale mais que
# os KB que "s" economizaria.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
# DELIBERADO — NÃO trocar por "abort": o supervisor depende de pânico de módulo
# virar JoinError para degradar e reiniciar só aquele módulo (module.rs). Com
# "abort", qualquer pânico derrubaria o painel inteiro.
panic = "unwind"

[workspace.dependencies]
eclipse-core = { path = "crates/eclipse-core" }
eclipse-obd = { path = "crates/eclipse-obd" }
eclipse-music = { path = "crates/eclipse-music" }
eclipse-messaging = { path = "crates/eclipse-messaging" }
eclipse-sim = { path = "crates/eclipse-sim" }
eclipse-gps = { path = "crates/eclipse-gps" }
eclipse-clima = { path = "crates/eclipse-clima" }
eclipse-mcp = { path = "crates/eclipse-mcp" }
eclipse-ia = { path = "crates/eclipse-ia" }

async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Já vinha na árvore pelo rspotify; agora é dependência direta do `eclipse-ia`.
# `rustls-tls` e não o TLS do sistema: o Android não tem OpenSSL para ligar.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# `rc`: o `StateEnvelope` carrega o payload num `Arc` para não clonar JSON
# fundo a cada publicação; a feature faz o serde atravessar o Arc.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
