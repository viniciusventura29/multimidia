[workspace]
members = ["src-tauri", "crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

# Um target/ de 1,8 GB para um app deste tamanho é quase todo símbolo de debug,
# e quase todo ele vem das dependências (tauri, wry, objc2...) — que ninguém vai
# depurar linha a linha. Cortar os símbolos delas devolve mais de 1 GB e mantém
# o nosso código com backtrace com número de linha.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[workspace.dependencies]
eclipse-core = { path = "crates/eclipse-core" }
eclipse-obd = { path = "crates/eclipse-obd" }
eclipse-music = { path = "crates/eclipse-music" }
eclipse-messaging = { path = "crates/eclipse-messaging" }
eclipse-sim = { path = "crates/eclipse-sim" }
eclipse-gps = { path = "crates/eclipse-gps" }
eclipse-mcp = { path = "crates/eclipse-mcp" }
eclipse-ia = { path = "crates/eclipse-ia" }

async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Já vinha na árvore pelo rspotify; agora é dependência direta do `eclipse-ia`.
# `rustls-tls` e não o TLS do sistema: o Android não tem OpenSSL para ligar.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# `rc`: o `StateEnvelope` carrega o payload num `Arc` para não clonar JSON
# fundo a cada publicação; a feature faz o serde atravessar o Arc.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
